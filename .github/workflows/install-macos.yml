name: macOS install smoke test

on:
  push:
  pull_request:

jobs:
  install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install, repeat, and check conflicts
        env:
          CODEX_HOME: ${{ runner.temp }}/ling-codex-home
        run: |
          for variant in ling ling-heart; do
            if [[ "$variant" == ling ]]; then
              args=()
            else
              args=(--variant "$variant")
            fi
            bash ./install.sh "${args[@]}"
            bash ./install.sh "${args[@]}"
            cmp "pet/$variant/pet.json" "$CODEX_HOME/pets/$variant/pet.json"
            cmp "pet/$variant/spritesheet.webp" "$CODEX_HOME/pets/$variant/spritesheet.webp"
            printf 'conflict\n' > "$CODEX_HOME/pets/$variant/pet.json"
            if bash ./install.sh "${args[@]}"; then
              echo "Expected installation conflict for $variant" >&2
              exit 1
            fi
          done
