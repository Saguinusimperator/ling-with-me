name: macOS install smoke test

on:
  push:
  pull_request:

jobs:
  install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install, repeat, and check conflicts
        env:
          CODEX_HOME: ${{ runner.temp }}/ling-codex-home
        run: |
          bash ./install.sh
          bash ./install.sh
          cmp pet/ling/pet.json "$CODEX_HOME/pets/ling/pet.json"
          cmp pet/ling/spritesheet.webp "$CODEX_HOME/pets/ling/spritesheet.webp"
          printf 'conflict\n' > "$CODEX_HOME/pets/ling/pet.json"
          if bash ./install.sh; then
            echo 'Expected installation conflict to stop the script' >&2
            exit 1
          fi
